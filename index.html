    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      /* Theme bootstrap — runs before paint to avoid FOUC.
         Priority: explicit user choice (localStorage) > Telegram colorScheme > OS preference > light. */
      (function () {
        function detect() {
          try {
            var saved = localStorage.getItem('xvpn-theme');
            if (saved === 'light' || saved === 'dark') return saved;
          } catch (e) {}
          try {
            var tg = window.Telegram && window.Telegram.WebApp;
            if (tg && (tg.colorScheme === 'light' || tg.colorScheme === 'dark')) return tg.colorScheme;
          } catch (e) {}
          try {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) return 'dark';
          } catch (e) {}
          return 'light';
        }
        document.documentElement.setAttribute('data-theme', detect());
      })();
    </script>
    <script type="module" crossorigin src="./app.js"></script>
    <link rel="stylesheet" crossorigin href="./styles.css">
